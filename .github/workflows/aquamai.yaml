name: AquaMai Build

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: aquamai-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      git_describe: ${{ steps.git-describe.outputs.git_describe }}
    steps:
      - name: Fix Git line encoding bug
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Download build references
        shell: pwsh
        env:
          REFERENCE_ARCHIVE_URL: ${{ vars.AQUAMAI_CI_REFERENCE_URL }}
          REFERENCE_ARCHIVE_SHA256: ${{ vars.AQUAMAI_CI_REFERENCE_SHA256 }}
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP "aquamai-ci-reference.zip"
          Invoke-WebRequest -Uri $env:REFERENCE_ARCHIVE_URL -OutFile $archivePath

          $actualHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = $env:REFERENCE_ARCHIVE_SHA256.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Reference archive SHA256 mismatch: expected $expectedHash, got $actualHash"
          }

          New-Item -ItemType Directory -Path "source/Libs" -Force | Out-Null
          Expand-Archive -LiteralPath $archivePath -DestinationPath "source/Libs" -Force

          @("AMDaemon.NET.dll", "Assembly-CSharp.dll") | ForEach-Object {
            if (-not (Test-Path -LiteralPath "source/Libs/$_" -PathType Leaf)) {
              throw "Reference archive is missing $_"
            }
          }

      - name: Get Git Describe
        id: git-describe
        shell: pwsh
        working-directory: source
        run: |
          $raw = git describe --tags --always
          if ($raw.StartsWith("v")) { $raw = $raw.Substring(1) }
          $parts = $raw.Split('-')
          if ($parts.Length -ge 3) {
            $ver = $parts[0].Split('.')
            $ver[2] = $parts[1]
            $raw = ($ver -join '.') + '-' + $parts[2]
          }
          "GIT_DESCRIBE=$raw" >> $env:GITHUB_ENV
          "git_describe=$raw" >> $env:GITHUB_OUTPUT

      - name: Build AquaMai
        shell: pwsh
        working-directory: source
        run: ./build.ps1

      - name: Prepare artifact
        shell: pwsh
        working-directory: source
        run: |
          New-Item -ItemType Directory -Path "Output/Upload" -Force | Out-Null
          Move-Item -Path "Output/AquaMai.dll" -Destination "Output/Upload/AquaMai.dll" -Force
          Move-Item -Path "Output/AquaMai.zh.toml" -Destination "Output/Upload/AquaMai.zh.toml" -Force
          Move-Item -Path "Output/AquaMai.en.toml" -Destination "Output/Upload/AquaMai.en.toml" -Force

      - name: Upload config sort check input
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: config-sort-check-input
          path: |
            source/checkSort.py
            source/AquaMai/configSort.yaml
            source/Output/Upload/AquaMai.zh.toml

      - name: Upload unsigned artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: AquaMai-unsigned
          path: source/Output/Upload

      - name: Upload artifact
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: AquaMai
          path: source/Output/Upload

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Download unsigned artifact
        uses: actions/download-artifact@v4
        with:
          name: AquaMai-unsigned
          path: Output/Upload

      - name: Checkout release assets
        uses: clansty/checkout@main
        with:
          repository: MuNET-OSS/AquaMai-Build-Assets
          ssh-key: ${{ secrets.BUILD_ASSETS_KEY }}
          path: release-assets
          max-attempts: 50
          min-retry-interval: 1
          max-retry-interval: 5

      - name: Sign and Upload CI release
        shell: cmd
        run: release-assets\Releaser\AquaMaiReleaser.exe "Output\Upload\AquaMai.dll" "${{ needs.build.outputs.git_describe }}"
        env:
          LEGACY_RELEASE_SIGN_PK: ${{ secrets.LEGACY_RELEASE_SIGN_PK }}
          RELEASE_SIGN_V2_PK: ${{ secrets.RELEASE_SIGN_V2_PK }}
          QCLOUD_SECRET_ID: ${{ secrets.QCLOUD_SECRET_ID }}
          QCLOUD_SECRET_KEY: ${{ secrets.QCLOUD_SECRET_KEY }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          VERSION_CONFIG_TOKEN: ${{ secrets.VERSION_CONFIG_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: AquaMai
          path: Output/Upload

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GIT_DESCRIBE: ${{ needs.build.outputs.git_describe }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          $Uri = "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMediaGroup"
          $GitDescribe = $env:GIT_DESCRIBE
          $CommitMessage = $env:COMMIT_MESSAGE
          $Form = @{
            chat_id = "-1002231087502"
            media = @(
              @{ type = "document"; media = "attach://aquamai_main"; caption = "$GitDescribe`n$CommitMessage" },
              @{ type = "document"; media = "attach://aquamai_zh" }
              @{ type = "document"; media = "attach://aquamai_en" }
            ) | ConvertTo-Json
            aquamai_main = Get-Item Output\Upload\AquaMai.dll
            aquamai_zh = Get-Item Output\Upload\AquaMai.zh.toml
            aquamai_en = Get-Item Output\Upload\AquaMai.en.toml
          }
          Invoke-RestMethod -Uri $uri -Form $Form -Method Post

  check-sort:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download check input
        uses: actions/download-artifact@v4
        with:
          name: config-sort-check-input
          path: check-input

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install PyYAML==6.0.2

      - name: Check config sort
        working-directory: check-input
        run: |
          mkdir -p Output
          mv Output/Upload/AquaMai.zh.toml Output/AquaMai.zh.toml
          python checkSort.py
